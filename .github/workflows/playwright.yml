name: Playwright Tests (Docker)

on:
  push:
    branches: [main, master, register]
  pull_request:
    branches: [main, master, register]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Playwright Tests – ${{ github.event.head_commit.message || github.event.pull_request.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: mcr.microsoft.com/playwright:v1.44.0-jammy

    steps:
      - name: Checkout playwright-tests repo
        uses: actions/checkout@v4
        with:
          path: playwright-tests

      - name: Checkout command-center app
        uses: actions/checkout@v4
        with:
          repository: manivannanhub/command-center
          path: command-center

      - name: Install app dependencies
        run: npm ci
        working-directory: command-center

      - name: Build frontend
        run: npm run build:app
        working-directory: command-center

      - name: Install test dependencies
        run: npm ci
        working-directory: playwright-tests

      - name: Run Playwright tests
        run: |
          npx start-server-and-test "node ../command-center/server.js" http://localhost:3005 \
          "npx playwright test --reporter=html,junit,line --workers=4 --timeout=20000 --trace=retain-on-failure"
        working-directory: playwright-tests
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-tests/test-results/

      - name: Upload traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-videos
          path: |
            playwright-tests/test-results/**/*.zip
            playwright-tests/test-results/**/*.webm
