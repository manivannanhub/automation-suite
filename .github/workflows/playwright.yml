$content = @"
name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: command-center
        run: npm install

      - name: Build frontend
        working-directory: command-center
        run: npm run build:app

      - name: Start application
        working-directory: command-center
        run: |
          nohup npm start > server.log 2>&1 &
          echo "Server starting..."
          sleep 10
          tail -n 20 server.log

      - name: Wait for app to be ready
        run: |
          for i in {1..40}; do
            if curl -s http://localhost:3005/api/healthz | grep -q "ok"; then
              echo "App is up!"
              exit 0
            fi
            echo "Waiting for app on port 3005..."
            sleep 2
          done
          echo "App did not start in time"
          echo "--- Server log ---"
          cat command-center/server.log
          exit 1

      - name: Install Playwright dependencies
        working-directory: playwright-tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: playwright-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: playwright-tests
        run: npx playwright test --reporter=html
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-tests/test-results
          retention-days: 7
"@
$content | Set-Content -Path ".github\workflows\playwright.yml" -Encoding UTF8