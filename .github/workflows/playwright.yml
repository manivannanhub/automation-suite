name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install dependencies for the app
      - name: Install app dependencies
        working-directory: command-center
        run: npm install

      # Start the app in background and log output
      - name: Start application
        working-directory: command-center
        run: |
          nohup npm start > server.log 2>&1 &
          echo "Server starting..."
          sleep 15
          tail -n 20 server.log

      # Wait for the app to be reachable (health check on port 3005)
      - name: Wait for app to be ready
        run: |
          for i in {1..40}; do
            if curl -s http://localhost:3005/api/healthz | grep -q "ok"; then
              echo "App is up!"
              exit 0
            fi
            echo "Waiting for app on port 3005..."
            sleep 2
          done
          echo "App did not start in time"
          echo "--- Server log ---"
          cat command-center/server.log
          exit 1

      # Install Playwright dependencies
      - name: Install Playwright dependencies
        working-directory: playwright-tests
        run: npm install

      # Install Playwright browsers
      - name: Install Playwright browsers
        working-directory: playwright-tests
        run: npx playwright install --with-deps

      # Run Playwright tests
      - name: Run Playwright tests
        working-directory: playwright-tests
        run: npx playwright test --reporter=html

      # Upload Playwright report
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report
          retention-days: 7
