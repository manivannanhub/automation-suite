name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:                          # ✅ ADDED: nightly run at 2am UTC
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ❌ REMOVED: FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 — unnecessary with setup-node@v4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            command-center/package-lock.json
            playwright-js/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('playwright-js/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install app dependencies
        working-directory: command-center
        run: npm ci

      - name: Build frontend
        working-directory: command-center
        run: npm run build:app

      - name: Start application
        working-directory: command-center
        run: |
          nohup npm start > server.log 2>&1 &
          echo 'Server starting...'
          # ❌ REMOVED: sleep 10 — the wait step below handles this reliably

      - name: Wait for app to be ready
        run: |
          for i in {1..40}; do
            if curl -s http://localhost:3005/api/healthz | grep -q 'ok'; then
              echo 'App is up!'
              exit 0
            fi
            echo "Attempt $i/40 — waiting for app on port 3005..."
            sleep 2
          done
          echo 'App did not start in time'
          echo '--- Server log ---'
          cat command-center/server.log
          exit 1

      - name: Install Playwright dependencies
        working-directory: playwright-js
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright-js
        # ✅ FIXED: added --with-deps (installs OS libs) + all 3 browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        working-directory: playwright-js
        # ✅ FIXED: added 'line' reporter for terminal output + GitHub annotations
        run: npx playwright test --reporter=html,line
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-js/playwright-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-js/test-results
          retention-days: 7

      # ✅ ADDED: upload server log when app fails to start
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: command-center/server.log
          retention-days: 3