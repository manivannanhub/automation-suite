name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1: Run all tests ──────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            command-center/package-lock.json
            playwright-js/package-lock.json

      # ── 3. Cache Playwright browsers ──────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('playwright-js/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # ── 4. Install app dependencies ───────────────────────────
      - name: Install app dependencies
        working-directory: command-center
        run: npm ci

      # ── 5. Build the frontend ─────────────────────────────────
      - name: Build frontend
        working-directory: command-center
        run: npm install && npm --workspace @workspace/app run build

      # ── 6. Start the application in background ────────────────
      - name: Start application
        working-directory: command-center
        run: nohup node server.js > server.log 2>&1 &
        env:
          NODE_ENV: production
          PORT: 3005

      # ── 7. Wait for app to be ready ───────────────────────────
      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to start on port 3005..."
          for i in {1..40}; do
            if curl -s http://localhost:3005/api/healthz | grep -q 'ok'; then
              echo "✅ App is up via /api/healthz!"
              exit 0
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3005 || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ App is up! HTTP status: $STATUS"
              exit 0
            fi
            echo "Attempt $i/40 — HTTP $STATUS — retrying in 2s..."
            sleep 2
          done
          echo "❌ App did not start within 80 seconds"
          cat command-center/server.log
          exit 1

      # ── 8. Seed test users ────────────────────────────────────
      # Credentials match playwright-js/test-data/users.json exactly
      - name: Seed test users for login and dashboard tests
        run: |
          seed_user() {
            local NAME="$1"
            local EMAIL="$2"
            local PASS="$3"

            echo "=== Registering $EMAIL ==="
            REGISTER=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:3005/api/auth/register \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$NAME\",\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")
            echo "Register HTTP status: $REGISTER"

            if [ "$REGISTER" != "201" ] && [ "$REGISTER" != "409" ]; then
              echo "❌ Unexpected register response for $EMAIL: $REGISTER"
              cat command-center/server.log
              exit 1
            fi

            echo "=== Verifying login for $EMAIL ==="
            LOGIN=$(curl -s -X POST http://localhost:3005/api/auth/login \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")

            if echo "$LOGIN" | grep -q 'user'; then
              echo "✅ $EMAIL ready"
            else
              echo "❌ Login failed for $EMAIL"
              echo "Response: $LOGIN"
              cat command-center/server.log
              exit 1
            fi
          }

          seed_user "Test User" "testuser@test.com" "Password123"
          seed_user "Admin"     "admin@admin.com"   "admin123"

      # ── 9. Install Playwright dependencies ────────────────────
      - name: Install Playwright dependencies
        working-directory: playwright-js
        run: npm ci

      # ── 10. Install Playwright browsers ───────────────────────
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: playwright-js
        run: npx playwright install --with-deps chromium

      # ── 11. Run Playwright tests ──────────────────────────────
      - name: Run Playwright tests
        working-directory: playwright-js
        run: npx playwright test --reporter=html,line
        env:
          CI: true
          BASE_URL: http://localhost:3005

      # ── 12. Upload HTML test report ───────────────────────────
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-js/reports/html
          retention-days: 7

      # ── 13. Upload raw test results ───────────────────────────
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-js/reports/test-results
          retention-days: 7

      # ── 14. Upload server log on failure ──────────────────────
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: command-center/server.log
          retention-days: 3

      # ── 15. Notify on nightly failure ─────────────────────────
      - name: Notify on nightly failure
        if: failure() && github.event_name == 'schedule'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"❌ Nightly Playwright run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # ── JOB 2: Deploy to Render (only if tests pass) ──────────────
  deploy:
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ── 1. Trigger Render deploy ───────────────────────────────
      - name: Deploy to Render
        run: |
          echo "🚀 Triggering deploy to Render..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render response: $RESPONSE"
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
            echo "✅ Deploy triggered successfully"
            echo "🔗 ${{ secrets.RENDER_APP_URL }}"
          else
            echo "❌ Deploy failed — HTTP $RESPONSE"
            exit 1
          fi